global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: secaudit-api
    metrics_path: /api/v1/metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: secaudit-api

  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          service: tempo
