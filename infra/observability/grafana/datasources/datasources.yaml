apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    uid: secaudit-tempo
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: GET
      tracesToMetrics:
        datasourceUid: secaudit-prometheus
        tags:
          - key: service.name
            value: service
          - key: http.method
          - key: http.route
          - key: secaudit.executor
        queries:
          - name: Request rate
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
          - name: Error rate
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags, status_code="STATUS_CODE_ERROR"}[5m]))'
          - name: p95 latency
            query: 'histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])) by (le))'
      serviceMap:
        datasourceUid: secaudit-prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: ""

  - name: Prometheus
    type: prometheus
    access: proxy
    uid: secaudit-prometheus
    url: http://prometheus:9090
    editable: true
    isDefault: true
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: secaudit-tempo
      timeInterval: 15s
