[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secaudit-core"
version = "0.1.0"
description = "Shared models, settings, and utilities for SecAudit API and workers"
authors = [{ name = "SecAudit Platform", email = "secauditplatform@proton.me" }]
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2.0",
    "sqlalchemy>=2.0.36",
    "pydantic-settings>=2.6.1",
    "cryptography>=44.0.0",
    "celery>=5.4.0",
    "croniter>=5.0.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.4",
    "xhtml2pdf>=0.2.16",
    "reportlab>=4.0.0",
    "boto3>=1.35.0",
    "defusedxml>=0.7.1",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-instrumentation>=0.50b0",
    "opentelemetry-instrumentation-celery>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-instrumentation-requests>=0.50b0",
    "opentelemetry-instrumentation-logging>=0.50b0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["secaudit_core*"]
