{{- if not .Values.existingSecret }}
{{- $redisPass := required "secrets.redisPassword (or existingSecret) is required" .Values.secrets.redisPassword -}}
{{- $pgPass := required "secrets.postgresPassword (or existingSecret) is required" .Values.secrets.postgresPassword -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secaudit.secretName" . }}
  labels:
    {{- include "secaudit.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secrets.secretKey (or existingSecret) is required" .Values.secrets.secretKey | quote }}
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  REDIS_PASSWORD: {{ $redisPass | quote }}
  METRICS_BEARER_TOKEN: {{ required "secrets.metricsBearerToken (or existingSecret) is required" .Values.secrets.metricsBearerToken | quote }}
  SECRETS_FERNET_ALLOWED_IN_PRODUCTION: {{ .Values.secrets.secretsFernetAllowedInProduction | toString | quote }}
  REDIS_URL: {{ printf "redis://:%s@%s:%v/%v" $redisPass .Values.externalRedis.host .Values.externalRedis.port .Values.externalRedis.db | quote }}
  CELERY_BROKER_URL: {{ printf "redis://:%s@%s:%v/%v" $redisPass .Values.externalRedis.host .Values.externalRedis.port .Values.externalRedis.db | quote }}
  CELERY_RESULT_BACKEND: {{ printf "redis://:%s@%s:%v/%v" $redisPass .Values.externalRedis.host .Values.externalRedis.port .Values.externalRedis.resultDb | quote }}
{{- end }}
