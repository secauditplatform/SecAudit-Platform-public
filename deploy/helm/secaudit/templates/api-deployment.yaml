apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secaudit.fullname" . }}-api
  labels:
    {{- include "secaudit.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "secaudit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "secaudit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "secaudit.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "secaudit.apiImage" . }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          args: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
          ports:
            - name: http
              containerPort: 8000
          {{- include "secaudit.env" . | nindent 10 }}
          env:
            - name: SKIP_MIGRATIONS
              value: "1"
            - name: OTEL_SERVICE_NAME
              value: secaudit-api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: profiles-data
              mountPath: /data/profiles
      volumes:
        - name: profiles-data
          {{- if or .Values.profiles.persistence.enabled .Values.profiles.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ include "secaudit.profilesClaim" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "secaudit.fullname" . }}-api
  labels:
    {{- include "secaudit.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "secaudit.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
